# The app marks drawn by make_icons.py. Each entry is one app; see doc/app-icons.md for how
# to choose a symbol, a number, a version and an element colour. `version` is major.minor:
# redraw the icons when it changes, never for a patch release. `metal = true` also writes
# icon-metal.svg for hero uses.

[[app]]
slug = "auris-studio"
name = "Auris Studio"
symbol = "Au"
number = 1
version = "1.0"
element = "gold"
ship = true

[[app]]
slug = "auris-studio-family"
name = "Auris Studio"  # the family form
symbol = "As"
number = 1
version = "1.0"
element = "gold"

