[package]
name = "atelier"
description = "A design language and component kit for gpui creator tools with built-in AI agent surfaces"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

# Pinned to the release Auris Studio builds against, so both can share one gpui in a workspace.
[dependencies]
gpui = "=0.2.2"
unicode-segmentation = "1.10"
# The welcome-screen backdrops and the 3-D plots hand gpui their frames as images, in gpui's own
# image type.
image = { version = "0.25", default-features = false }
# gpui takes no custom shaders, so they shade their frames on the crate's own small wgpu device
# and read them back. wgpu 25 shares naga with gpui's renderer.
# On Windows, Cargo.lock keeps gpu-allocator on windows 0.58 to match wgpu-hal; if a fresh lock
# moves it to 0.57 (gpui's sysinfo uses that), `cargo update -p gpu-allocator` puts it back.
wgpu = "25"
pollster = "0.4"

# `set_window_background` reaches the window's `NSVisualEffectView` through the handle gpui hands
# out, to pick a material that still blurs on macOS 26 and later.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"

# On Windows it reaches the window's `HWND` the same way, to put DWM's own acrylic behind it.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

# `runtime_shaders` compiles the Metal shaders at start-up, so the gallery builds on a Mac with
# only the Command Line Tools installed. Feature unification applies it to the library as well
# whenever the examples are built.
[dev-dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders", "test-support"] }
# Checks the ambient backdrops' shaders without a GPU; the naga wgpu 25 uses.
naga = { version = "25", features = ["wgsl-in"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
