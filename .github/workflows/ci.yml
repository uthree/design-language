name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  adoption:
    name: Adoption check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The examples model how applications use Atelier, so they must pass the check apps run.
      - run: skills/atelier-gpui/tools/check-adoption.sh --strict examples
      - name: The check catches a wrapped component
        run: |
          mkdir -p "$RUNNER_TEMP/app/src"
          echo 'let x = div().debug_selector(|| "save".into()).child(Button::new("save", "Save"));' \
            > "$RUNNER_TEMP/app/src/main.rs"
          ! skills/atelier-gpui/tools/check-adoption.sh "$RUNNER_TEMP/app/src"

  check:
    name: Clippy, test, build (${{ matrix.os }})
    # The platforms Auris Studio ships on.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
      - run: cargo build --examples --locked
      # Applications may turn the wgpu shading off; the CPU paths must build alone.
      - run: cargo clippy --lib --no-default-features --locked
      # The agent runner and its example build only with `agents`.
      - run: cargo clippy --all-targets --features agents --locked
      - run: cargo test --features agents --test agent_runner --locked
      # The language-file generator is a build-script feature, which plain `cargo test` leaves off.
      - run: cargo test -p atelier-i18n --features build --locked

  app-icon:
    name: App icon action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: icon
        uses: ./.github/actions/app-icon
        with:
          slug: auris-studio
          version: v0.13.0
          out: ${{ runner.temp }}/icons
      - name: Check every file was drawn
        env:
          DIR: ${{ steps.icon.outputs.dir }}
        run: |
          for file in icon.svg icon-corners.svg icon-medium.svg icon-small.svg icon-macos.svg \
                      icon.icns icon.ico symbolic.svg png/16.png png/128.png png/1024.png; do
            test -s "$DIR/$file" || { echo "missing $file"; exit 1; }
          done
