[package]
name = "atelier-agents-mock"
description = "Stand-ins for the coding-agent CLIs and an OpenAI-compatible server, scripted by rules, for tests"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/uthree/design-language"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
atelier-agents = { path = "../atelier-agents" }
tempfile = "3"
